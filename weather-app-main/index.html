<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="static/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans">
  <title>Frontend Mentor | Weather app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body style="background-color: rgb(1, 1, 47);">
  
  <header class="container">

   <!----Navigation bar--->
    <nav class="navbar navbar-expand">
      <img class="navbar-brand" src="./assets/images/logo.svg" alt="logo icon" />
      <select class="value-change">
        <option value="switch-option">Units</option>
        <optgroup label="Temperature">
          <option value="imperial">Celsius (°C)</option>
          <option value="metric">Fahrenheit (°F)</option>
          <hr />
        </optgroup>
        <optgroup label="Wind Speed">
          <option value="imperial">km/h</option>
          <option value="metric">mph</option>
          <hr />
        </optgroup>
        <optgroup label="Precipitation">
          <option value="imperial">Millimeters (mm)</option>
          <option value="metric">Inches (in)</option>
          <hr />
        </optgroup>
      </select>
    </nav>

    <!---Search city input--->
    <h1 class="main-heading">How's the sky looking today?</h1>
    <div class="container">
      <form id="location-form" class="row">
        <input class="search-input col-12" id="location-name-input" label="Location"
          placeholder="Search for a place..." />
        <button type="submit" class="search-input-button col-12">Search</button>
      </form>
    </div>

  </header>

  <main class="container main-content">
    <div class="row">
      <div class="column col-12 col-md-8">

        <!---Big blue box with the weather and the daily forecast--->
        <div class="today-forecast">
          <div class="today-location"><span id="location-name"></span></div>
          <div class="today-dateandtime"><span id="time"></span> <span id="day"></span></div>
          <h1 class="today-temperature"><img id="weather" src="" alt="Weather icon"><span id="temperature"> C</span></h1>
          
        </div>

        <!---minor weather conditions-->
        <div class="container">
          <div class="row gx-2">
            <div class="column col-6 col-md-3 weather-boxes weather-boxes-row">
              Feels like
              <div id=""><span id="feels-like"> </span></div>
            </div>

            <div class="column col-6 col-md-3 weather-boxes">
              Humidity
              <div id=""><span id="humidity"></span></div>
            </div>

            <div class="column col-6 col-md-3 weather-boxes">
              Wind
              <div id=""><span id="wind-speed"></span></div>
            </div>

            <div class="column col-6 col-md-3 weather-boxes">
              Precipitation
              <div id=""><span id="precipitation"></span></div>
            </div>
          </div>
        </div>

        <!---Daily forecast for the 7 days of the week--->
        <div class="daily-forecast">
          <h3>Daily forecast</h3>
          <div class="row">
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-0-name" class="day-name">____</h6>
              <img id="icon-daily-forcast" src="../weather-app-main/assets/images/icon-drizzle.webp" alt="Weather icon">
              <div class="justify-content-between"><span id="min-temp-0">m</span> <span id="max-temp-0">M</span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-1-name">____ </h6>
              <img id="icon-daily-forcast" src="" alt="Weather icon">
              <div><span id="min-temp-1"></span><span id="max-temp-1"></span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-2-name">____</h6>
              <img id="icon-daily-forcast" src="" alt="Weather icon">
              <div><span id="min-temp-2"></span><span id="max-temp-2"></span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-3-name">____</h6>
              <img id="icon-daily-forcast" src="" alt="Weather icon">
              <div><span id="min-temp-3"></span><span id="max-temp-3"></span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-4-name">____</h6>
              <img id="icon-daily-forcast" src="" alt="Weather icon">
              <div><span id="min-temp-4"></span><span id="max-temp-4"></span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-5-name">____</h6>
              <img id="icon-daily-forcast" src="" alt="Weather icon">
              <div><span id="min-temp-5"></span><span id="max-temp-5"></span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-6-name">____</h6>
              <img id="icon-daily-forcast" src="" alt="Weather icon">
              <div><span id="min-temp-6"></span><span id="max-temp-6"></span></div>
            </div>
          </div>
        </div>
      </div>

      <!---Hourly forecast by the date of the week--->
      <div class="col-12 col-md-4">
        <div class="hourly-forecast justify-content-between">
          <h3>Hourly forecast</h3>
          <select>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
          <!-- Insert hourly forecast for the selected day here -->
        </div>
      </div>

    </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script src="config.js"></script>
  <script src="static/apiweather.js"></script>
</body>

</html>
