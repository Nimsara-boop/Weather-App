<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <title>Frontend Mentor | Weather app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body style="background-color: rgb(1, 1, 33);">
  <header class="container">

    <nav>
      <img class="navbar-brand" src="./assets/images/logo.svg" alt="logo icon" />
      <select class="value-change">
        <option value="Switch-option">Switch to Imperial</option>
        <optgroup label="Temperature">
          <option value="imperial">Celsius (°C)</option>
          <option value="metric">Fahrenheit (°F)</option>
          <hr />
        </optgroup>
        <optgroup label="Wind Speed">
          <option value="imperial">km/h</option>
          <option value="metric">mph</option>
          <hr />
        </optgroup>
        <optgroup label="Precipitation">
          <option value="imperial">Millimeters (mm)</option>
          <option value="metric">Inches (in)</option>
          <hr />
        </optgroup>
      </select>
    </nav>
    <h1>How's the sky looking today?</h1>
    <div>
      <form id="location-form">
        <input class="search-input" id= "location-name-input" label="Location"
          placeholder="Search for a city, e.g., New York" />
        <button type="submit">Search</button>
      </form>
    </div>

  </header>

  <main class="container" style="background-color:blueviolet">
    <div class="row" style="background-color:chartreuse">
      <div class="column col-12 col-md-8">
        <div style="color:whitesmoke ;background: blue; margin: 0 auto;">
          <h3>Big weather display</h3> 
          <h4>Location: <span id="location-name"></span></h4>
          <h4>Temperature: <span id="temperature"></span></h4>       
        </div>

        <div class="row">

          <div class="column col-6 col-md-3" style="background-color: rgb(251, 82, 82);">
            Feels like
            <div id=""><span id="feels-like"></span></div>
          </div>

          <div class="column col-6 col-md-3" style="background-color: rgb(222, 251, 171);">
            Humidity
            <div id=""><span id="humidity"></span></div>
          </div>

          <div class="column col-6 col-md-3" style="background-color: rgb(186, 156, 254);">
            Wind
            <div id=""><span id="wind-speed"></span></div>

            <!-- Insert wind here -->
          </div>

          <div class="column col-6 col-md-3" style="background-color:rgb(144, 225, 255)">
            Precipitation
            <div id=""><span id="precipitation"></span></div>
            <!-- Insert precipitation here -->
          </div>
        </div>

        <div>
          <div>
            <h3>Daily forecast</h3>
            <div class="row">
              <div class="col-4 col-md-1">Tuesday</div>
              <div class="col-4 col-md-1">Wednesday</div>
              <div class="col-4 col-md-1">Thursday</div>
              <div class="col-4 col-md-1">Friday</div>
              <div class="col-4 col-md-1">Saturday</div>
              <div class="col-4 col-md-1">Sunday</div>
              <div class="col-4 col-md-1">Monday</div>

            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div>
          <h3>Hourly forecast</h3>
          <select>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
          <!-- Insert hourly forecast for the selected day here -->
        </div>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script src="apiweather.js"></script>
</body>

</html>
