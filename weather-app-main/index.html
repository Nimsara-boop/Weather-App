<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="static/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans">
  <title>Frontend Mentor | Weather app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body style="background-color: rgb(1, 1, 47);">
  <header class="container">

    <nav class="navbar navbar-expand">
      <img class="navbar-brand" src="./assets/images/logo.svg" alt="logo icon" />
      <select class="value-change">
        <option value="switch-option">Units</option>
        <optgroup label="Temperature">
          <option value="imperial">Celsius (°C)</option>
          <option value="metric">Fahrenheit (°F)</option>
          <hr />
        </optgroup>
        <optgroup label="Wind Speed">
          <option value="imperial">km/h</option>
          <option value="metric">mph</option>
          <hr />
        </optgroup>
        <optgroup label="Precipitation">
          <option value="imperial">Millimeters (mm)</option>
          <option value="metric">Inches (in)</option>
          <hr />
        </optgroup>
      </select>
    </nav>
    <h1 class="main-heading">How's the sky looking today?</h1>
    <div class="container">
      <form id="location-form" class="row">
        <input class="search-input col-12" id="location-name-input" label="Location"
          placeholder="Search for a place..." />
        <button type="submit" class="search-input-button col-12">Search</button>
      </form>
    </div>

  </header>

  <main class="container">
    <div class="row">
      <div class="column col-12 col-md-8">
        <div class="today-forecast">
          <h3 class="today-location">Location:<span id="location-name"></span></h3>
          <h4 class="today-dateandtime">Day and time: <span id="time"></span>  <span id="day"></span></h4>
          <h6 class="today-temperature"><span id="temperature"> C</span></h6>
          <img id="weather" src="" alt="Weather icon">
        </div>

        <div class="container">
          <div class="row justify-content-between">
            <div class="column col-6 col-md-3 weather-boxes">
              Feels like
              <div id=""><span id="feels-like"></span></div>
            </div>

            <div class="column col-6 col-md-3 weather-boxes">
              Humidity
              <div id=""><span id="humidity"></span></div>
            </div>

            <div class="column col-6 col-md-3 weather-boxes">
              Wind
              <div id=""><span id="wind-speed"></span></div>

              <!-- Insert wind here -->
            </div>

            <div class="column col-6 col-md-3 weather-boxes">
              Precipitation
              <div id=""><span id="precipitation"></span></div>
              <!-- Insert precipitation here -->
            </div>
          </div>
        </div>

        <div>
          <div>
            <h3>Daily forecast</h3>
            <div class="row">
              <div class="col-4 col-md-1">
                <h6 id="Day-0-name">Tuesday</h6>
                <span id="Day0-daily-forcast"></span>
              </div>
              <div class="col-4 col-md-1">
                <h6 id="Day-1-name">Wednesday</h6>
                <span id="Day1-daily-forcast"></span>
              </div>
              <div class="col-4 col-md-1">
                <h6 id="Day-2-name">Thursday</h6>
                <span id="Day2-daily-forcast"></span>
              </div>
              <div class="col-4 col-md-1">
                <h6 id="Day-3-name">Friday</h6>
                <span id="Day3-daily-forcast"></span>
              </div>
              <div class="col-4 col-md-1">
                <h6 id="Day-4-name">Saturday</h6>
                <span id="Day4-daily-forcast"></span>
              </div>
              <div class="col-4 col-md-1">
                <h6 id="Day-5-name">Sunday</h6>
                <span id="Day5-daily-forcast"></span>
              </div>
              <div class="col-4 col-md-1">
                <h6 id="Day-6-name">Monday</h6>
                <span id="Day6-daily-forcast"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div>
          <h3>Hourly forecast</h3>
          <select>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
          <!-- Insert hourly forecast for the selected day here -->
        </div>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script src="config.js"></script>
  <script src="static/apiweather.js"></script>
</body>

</html>
