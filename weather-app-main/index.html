<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="static/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans">
  <title>Frontend Mentor | Weather app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body style="background-color: rgb(1, 1, 47);">

  <header class="container">

    <!----Navigation bar--->
    <nav class="navbar navbar-expand-lg justify-content-between">
      <img class="navbar-brand" src="./assets/images/logo.svg" alt="logo icon" />

      <select class="value-change" id="unit-switch" name="unit-switch">
        <option value="switch-option">Units</option>
        <optgroup label="Temperature" type="radio" id="Temperature-units">
          <radio value="imperial">Celsius (°C)</option>
            <radio value="metric">Fahrenheit (°F)</option>
              <hr />
        </optgroup>
        <optgroup label="Wind Speed" type="radio" id="Wind-Speed-units">
          <option value="imperial">km/h</option>
          <option value="metric">mph</option>
          <hr />
        </optgroup>
        <optgroup label="Precipitation" type="radio" id="Precipitation-units">
          <option value="imperial">Millimeters (mm)</option>
          <option value="metric">Inches (in)</option>
          <hr />
        </optgroup>
      </select>

      <!---
            <div class="unit-selectors">
        <select id="temperature-unit">
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
        </select>

        <select id="windspeed-unit">
          <option value="kmh">km/h</option>
          <option value="mph">mph</option>
        </select>

        <select id="precipitation-unit">
          <option value="mm">Millimeters (mm)</option>
          <option value="inches">Inches (in)</option>
        </select>
      </div> --->
    </nav>

    <!---Search city input--->
    <h1 class="main-heading">How's the sky looking today?</h1>
    <div class="container form-div">
      <form id="location-form" class="location-form">
        <input class="search-input " id="location-name-input" label="Location" placeholder="Search for a place..." />
        <button type="submit" class="search-input-button">Search</button>
      </form>
    </div>

  </header>

  <main class="container">
    <div class="row">
      <div class="column col-12 col-md-8">

        <!---Big blue box with the weather and the daily forecast--->
        <div class="today-forecast container">
          <div class="row">
            <div class="col-12 col-md-8">
              <div class="today-location"><span id="location-name"></span></div>
              <div class="today-dateandtime"><span id="time" class="leave-x-gap"></span><span id="day"></span><span>,
                </span><span id="exact-date"></span></div>
            </div>
            <div class="col-12 col-md-4">
              <div class="today-temperature"><img id="weather" src="" alt="Weather icon"><span id="temperature"> </span>
              </div>
            </div>
          </div>
        </div>

        <!---minor weather conditions-->
        <div class="container">
          <div class="row justify-content-between">

            <div class="column col-6 col-md-3 ">
              <div class="weather-boxes">Feels like
                <div class="minor-value"><span id="feels-like">Loading...</span></div>
              </div>
            </div>

            <div class="column col-6 col-md-3">
              <div class="weather-boxes">Humidity
                <div class="minor-value"><span id="humidity">Loading...</span></div>
              </div>
            </div>

            <div class="column col-6 col-md-3 ">
              <div class="weather-boxes">Wind
                <div class="minor-value"><span id="wind-speed">Loading...</span></div>
              </div>
            </div>

            <div class="column col-6 col-md-3 ">
              <div class="weather-boxes">Precipitation
                <div class="minor-value"><span id="precipitation">Loading...</span></div>
              </div>
            </div>
          </div>
        </div>

        <!---Daily forecast for the 7 days of the week--->
        <div class="daily-forecast container">
          <h3>Daily forecast</h3>
          <div class="row justify-content-between align-items-center">
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-0-name" class="day-name">____</h6>
              <img class="daily-weather-icon" id="icon-day-0-forecast" src="" alt="icon">
              <div class="justify-content-between"><span id="min-temp-0">__</span> <span id="max-temp-0">__ </span>
              </div>
            </div>
            <div class=" daily-forcast-day">
              <h6 id="Day-1-name">____ </h6>
              <img class="daily-weather-icon" id="icon-day-1-forecast" src="" alt="icon">
              <div><span id="min-temp-1">__</span><span id="max-temp-1">__</span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-2-name">____</h6>
              <img class="daily-weather-icon" id="icon-day-2-forecast" src="" alt="icon">
              <div><span id="min-temp-2">__</span><span id="max-temp-2">__</span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-3-name">____</h6>
              <img class="daily-weather-icon" id="icon-day-3-forecast" src="" alt="icon">
              <div><span id="min-temp-3">__</span><span id="max-temp-3">__</span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-4-name">____</h6>
              <img class="daily-weather-icon" id="icon-day-4-forecast" src="" alt="icon">
              <div><span id="min-temp-4">__</span><span id="max-temp-4">__</span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-5-name">____</h6>
              <img class="daily-weather-icon" id="icon-day-5-forecast" src="" alt="icon">
              <div><span id="min-temp-5">__</span><span id="max-temp-5">__</span></div>
            </div>
            <div class="col-4 col-md-1 daily-forcast-day">
              <h6 id="Day-6-name">____</h6>
              <img class="daily-weather-icon" id="icon-day-6-forecast" src="" alt="icon">
              <div><span id="min-temp-6">__</span><span id="max-temp-6">__</span></div>
            </div>
          </div>
        </div>
      </div>

      <!---Hourly forecast by the date of the week--->
      <div class="col-12 col-md-4">
        <div class="hourly-forecast container">
          <span class="hourly-header justify-content-between align-items-center d-flex">
            <h3>Hourly forecast</h3>
            <select class="hourly-select" id="hourly-select">
              <option value="hourly-day-0-value" id="hourly-day-0-name">___</option>
              <option value="hourly-day-1-value" id="hourly-day-1-name">___</option>
              <option value="hourly-day-2-value" id="hourly-day-2-name">___</option>
              <option value="hourly-day-3-value" id="hourly-day-3-name">___</option>
              <option value="hourly-day-4-value" id="hourly-day-4-name">___</option>
              <option value="hourly-day-5-value" id="hourly-day-5-name">___</option>
              <option value="hourly-day-6-value" id="hourly-day-6-name">___</option>
            </select>
          </span>
          <div class="hourly-forcast-container" id="hourly-forecast-container">
            <!---Duplicated by JS--->
          </div>
        </div>
      </div>

    </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script src="config.js"></script>
  <script src="static/apiweather.js"></script>
</body>

</html>
